debug=false;            //デバッグモード(true,false)
console=true;           //コンソールに通信状況を表示するか否か(true,false)
mqttip=192.168.1.10;    //MQTTブローカーとしてのIPアドレス (親機側のネットワーク)
bacip=192.168.1.10;     //BACnetDeviceとしてのIPアドレス (BMS 側のネットワーク。MQTT と別のネットワークでもよい)
#bacip=127.0.0.1;       //BACnetDeviceとしてのIPアドレス
bacport=47808;          //BACnetポート (標準は 47808。サーバを複数置くときは IP アドレスを分ける)
bacdevice=auto;         //BACnet Device インスタンス番号 (auto なら bacip の末尾の数。例 192.168.100.25 → 25)
#bacname=PoEM_Server;   //BACnet Device の名前 (省略時は PoEM_Server_<インスタンス番号>)

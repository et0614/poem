# site/ (PoEM Link のサポートとプライバシーポリシー) を GitHub Pages に公開する。
#
# 使う前に、リポジトリの Settings → Pages → Build and deployment の Source を「GitHub Actions」にする。
# private のリポジトリで Pages を使うには有料プラン (GitHub Pro など) が要る。無料プランでは
# リポジトリを public にしてから有効にする。Pages が無効のままだとこのワークフローは失敗する。

name: pages

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
